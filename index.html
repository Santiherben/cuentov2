<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Cuentos Accesible</title>
    <link rel="stylesheet" href="pepito.css">
    <!-- Librería PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Librería PageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
</head>
<body>
    <div class="header">
        <h1>Lector de Cuentos</h1>
        
        <!-- Panel de Accesibilidad -->
        <div class="accessibility-panel">
            <button id="btn-read" class="btn btn-audio" title="Leer página actual en voz alta">🔊 Leer en voz alta</button>
            <button id="btn-zoom-out" class="btn btn-zoom" title="Alejar">🔍 -</button>
            <button id="btn-zoom-in" class="btn btn-zoom" title="Acercar">🔍 +</button>
        </div>

        <div id="loading">Cargando la magia del cuento...</div>
    </div>

    <!-- Controles de navegación -->
    <div class="navigation-controls">
        <button id="btn-prev" class="btn btn-nav">◀ Página Anterior</button>
        <button id="btn-next" class="btn btn-nav">Página Siguiente ▶</button>
    </div>

    <!-- Contenedor del libro -->
    <div class="book-container">
        <div id="flip-book" class="flip-book"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
